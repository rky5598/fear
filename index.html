<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта страхов — опросник Дня 1</title>
<style>
:root{--bg:#0f1220;--card:#1a1f33;--card2:#232a45;--txt:#e8ebf5;--dim:#9aa3c0;--acc:#7fa6ff;--ok:#6fe0a8;--bad:#ff7b8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5em;margin:.2em 0}
h2{font-size:1.2em;margin:1.2em 0 .4em}
.sub{color:var(--dim)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#151930;border-top:1px solid #2a3355;padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:10}
button{background:var(--acc);color:#0b1030;border:none;border-radius:10px;padding:12px 22px;font-size:1em;font-weight:600;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.vhead{margin:1.4em 0 .5em;padding:10px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:8px}
.vhead b{font-size:1.05em}
.vhead .m{color:var(--dim);font-size:.9em}
.card{background:var(--card);border:1px solid #2a3355;border-radius:12px;margin:10px 0;overflow:hidden}
.card-h{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.card-h:hover{background:var(--card2)}
.card-h .arr{color:var(--dim);transition:.2s}
.card.open .card-h .arr{transform:rotate(90deg)}
.card-body{display:none;padding:0 16px 14px}
.card.open .card-body{display:block}
.card-body p{margin:.4em 0;color:var(--txt)}
.card-body .ex{color:var(--dim);font-size:.93em;margin:.5em 0;padding-left:12px;border-left:2px solid #3a466f}
.chip{display:inline-block;margin:4px 6px 0 0;padding:7px 13px;border:1px solid #3a466f;border-radius:20px;cursor:pointer;font-size:.92em;user-select:none;transition:.15s}
.chip.sel{background:var(--acc);color:#0b1030;border-color:var(--acc);font-weight:600}
.badge{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:8px;background:var(--bad);color:#fff;margin-left:8px;vertical-align:middle}
.addrow{margin-top:10px;display:flex;gap:8px}
.addrow input{flex:1;background:#12162a;border:1px solid #3a466f;color:var(--txt);border-radius:8px;padding:9px 12px;font-size:.95em}
.count{color:var(--ok);font-size:.85em;margin-left:8px}
.opt{display:block;margin:8px 0;padding:12px 14px;border:1px solid #3a466f;border-radius:10px;cursor:pointer}
.opt.sel{border-color:var(--acc);background:#1c2444}
table{width:100%;border-collapse:collapse;margin:12px 0}
th,td{border:1px solid #2a3355;padding:8px 10px;text-align:left;font-size:.93em}
th{background:#1a2038}
.lead{background:var(--card);border-left:4px solid var(--ok);border-radius:8px;padding:14px 16px;margin:14px 0}
.warnbox{background:#2a1c1c;border-left:4px solid var(--bad);border-radius:8px;padding:12px 16px;margin:12px 0}
.repbtns{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
@media print{.repbtns{display:none}.bar{display:none}body{background:#fff;color:#000}.card,.vhead,table td,table th{border-color:#999}}
</style>
</head>
<body>
<div class="wrap">
<h1>🧭 Карта страхов — опросник Дня 1</h1>
<p class="sub">Отмечайте только то, что про вас. Выбор сохраняется автоматически — можно вернуться и дополнить.</p>
<div id="app"></div>
</div>
<div class="bar">
<button class="ghost" id="bBack">← Назад</button>
<button id="bNext">Далее →</button>
<button class="ghost" id="bReset">Сброс</button>
</div>

const DATA = {
mysh:{name:"Мышечный",chakra:"Муладхара",root:"отсутствие «Я»",partner:"Кожный",

{t:"Насилие и угроза телу",d:"Витальный страх физической расправы, ограбления, агрессии со стороны незнакомцев.",ex:["Обходите компанию шумных незнакомцев и ускоряете шаг.","Ночью вздрагиваете от каждого шума во дворе."],f:["Нападения, ограбления, расправы","Того, что меня ударят","Войны, беспорядков, «мир рушится»"]}]},

kozh:{name:"Кожный",chakra:"Муладхара + Манипура",root:"жадность",partner:"Мышечный",
heal:"Границу восстанавливает тело и режим: спорт, дисциплина, режим дня — но без брони. Тело учится держать форму без «стен». Переход: вернуть жизнь телу, а контроль — делу.",
cards:[

{t:"Сорванная сделка, «я проиграл»",d:"Страх неудачи в обмене: не получить то, за что боролся, остаться в проигрыше.",ex:["Перед любым переговором «накручиваете»: а вдруг откажут?","После проигранной ситуации долго мысленно возвращаетесь: надо было иначе."],f:["Проиграть, быть побеждённым","Обмана при сделке, «меня надуют»","Разочарования: я ожидал большего"]}]},

anal:{name:"Анальный",chakra:"Свадхистхана + Манипура",root:"обида",partner:"Уретральный",

cards:[

ur:{name:"Уретральный",chakra:"Свадхистхана",root:"жажда жизни",partner:"Анальный",
heal:"Порыв не лечится от страха — он лечится опорой. Партнёр — анальный: удержание, форма, «стая, которая держит». Малодушие (Lv) — одно из состояний за пределами чакр: напрямую не прорабатывается, тело снимает его постепенно через безопасный опыт и верность своих.",
cards:[

{t:"«Не успеть спасти»",d:"Страх не успеть спасти, не обеспечить тех, за кого отвечаю. Ответственность за стаю давит как нести ящик с жизнями.",ex:["Звонок близкого без ответа — мгновенная паника «что случилось».","Праздник или кризис для семьи держите на себе, и если что-то пошло не так — «это на мне»."],f:["Не успеть спасти близких","Не суметь обеспечить семью","Того, что я подведу своих","Ответственности за всех"]},

obn:{name:"Обонятельный",chakra:"Аджна",root:"презрение",partner:"Звуковой",
heal:"Чутьё не выключается — оно переучивается слушать. Партнёр — звуковой: смысл вместо подозрения. Переход: «услышать другого» — спросить, а не угадывать враждебное.",

{t:"Внезапная катастрофа",d:"Страх, что беда придёт внезапно, без запаха и знака: «не чую — значит, не увижу».",ex:["Чувствуете себя «должен быть готов к худшему всегда».","Новости о несчастных случаях укрепляют внутреннюю «боевую готовность»."],f:["Внезапных катастроф","Того, что не успею подготовиться","Стихийных бедствий"]}]},

zvuk:{name:"Звуковой",chakra:"Аджна + Сахасрара",root:"пустота",partner:"Зрительный",
heal:"Пустоту закрывает видение и любовь: партнёр — зрительный. Смотреть на мир глазами красоты — «что я вижу прекрасного сегодня» — вместо слушания собственных кругов. Переход: «перевести страх в расчёт и мысль».",

{t:"Потеря близких",d:"Страх утраты близких: самое дорогое можно потерять в любой момент.",ex:["Задерживается близкий без ответа — в голове выстраивается катастрофа.","Мысль «а что будет, если его не станет» — и по телу идёт холод."],f:["Потери близких","Смерти близких","Того, что близкий заболеет","Расставания, разлуки"]},
{t:"Фобии: темнота, кровь, боль",d:"Классические страхи зрительного корня: темнота, кровь, уколы, боль.",ex:["В темноте перед сном возникает ощущение присутствия.","Вид крови или укол — мгновенная слабость, дурнота."],f:["Темноты","Крови, уколов","Боли","Медицинских процедур"]},
{t:"Страх оценки и взглядов",d:"Страх быть увиденным, оценённым, высмеянным. Кожа становится слишком тонкой.",ex:["Перед публичным словом — «все увидят мой страх».","Не фотографируетесь, не поёте, не танцуете — «какая-то неловкая я»."],f:["Оценки, осуждения","Насмешек, срама","Публичности, сцены"]},
{t:"Спасатель: «не справлюсь без меня»",d:"Страх, что без моего вмешательства кто-то пострадает. Роль вместо человека — первая ловушка на пути к любви.",ex:["Не можете пройти мимо чужой беды — и выгораете.","Близкий в беде — вас трясёт сильнее, чем его самого."],f:["Того, что я не спасу","Того, что пострадает другой","Выгорания от чужих эмоций"]},
{t:"Ненависть и фиксация страха",d:"Зафиксированный страх — «не выйду из дома», «не поеду туда». Страх становится структурой жизни (As/Bk).",ex:["Сужение маршрута: «могу только дом — работа — магазин».","Объект страха (лифт, толпа, конкретный человек) оброс ритуалами избегания."],f:["Панических атак","Не выйти из дома","Замкнутых пространств","Открытых пространств, толп"]},
{t:"Ослепление: «свет поглотил»",d:"Экстремальное состояние (Mc): свет ослепил — вижу только тьму. За пределами чакр: не прорабатывается, выход через тело, сон, живой контакт и специалиста.",ex:["После пикового переживания мир будто обесцветился и страх тотален.","Слёзы и паника «внутри всё рухнуло»."],f:["Тотального коллапса чувств","Того, что «света больше нет»"]}]},
};

const BEYOND_CARDS = new Set(["«Все против меня» (паранойя)","Ослепление: «свет поглотил»","Высота, вода, скорость (малодушие)"]);
const REACTS = [
["Вспышкой — испуг, дрожь, резкий импульс","Стресс (острая)"],
["Паническим приступом — тело в панике","Стресс (паника)"],
["Тревогой фоном — без адреса, постоянно","Фрустрация"],
["Как черта — «я просто такой человек»","Невроз"],
["Парализует — не могу двигаться, выйти, начать","Невроз (ригидный)"]
];
const ELEM = ["P","P","As","Bk/Lv","Cs"];
const LADDER = "Оцепенение → Испуг → Тревога → Страх → Паника → Смелость";

let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem("fearMap")||"{}"); }catch(e){ return {}; } }
function save(){ if(!state.custom) state.custom={}; if(!state.react) state.react={}; if(!state.open) state.open={}; localStorage.setItem("fearMap", JSON.stringify(state)); }

const app = document.getElementById("app");
let screen = "s1";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;")}

function selectedFears(){
  const out = [];
  for(const vk in DATA){
    DATA[vk].cards.forEach((c,ci)=>{
      c.f.forEach((f,fi)=>{
        const key = vk+"_"+ci+"_"+fi;
        if(state[key]) out.push({key, vector:vk, text:f, card:c.t, custom:false});
      });
    });
    (state.custom[vk]||[]).forEach((f,fi)=>{
      out.push({key:"c_"+vk+"_"+fi, vector:vk, text:f, card:"свой вариант", custom:true});
    });
  }
  return out;
}

function renderS1(){
  let html = "";
  for(const vk in DATA){
    const v = DATA[vk];
    html += `<div class="vhead"><b>${v.name} вектор</b> <span class="m">— чакра ${v.chakra}, корень: ${v.root}</span></div>`;
    v.cards.forEach((c,ci)=>{
      const sel = c.f.filter((f,fi)=>state[vk+"_"+ci+"_"+fi]).length;
      const isOpen = state.open[vk+"_"+ci] ? " open" : "";
      html += `<div class="card${isOpen}" id="card_${vk}_${ci}">
        <div class="card-h" data-act="toggle" data-card="${vk}_${ci}"><span>${esc(c.t)}${sel?`<span class="count">● ${sel}</span>`:""}</span><span class="arr">▸</span></div>
        <div class="card-body">
          <p>${esc(c.d)}</p>
          ${c.ex.map(e=>`<div class="ex">«${esc(e)}»</div>`).join("")}
          <div style="margin-top:8px">${c.f.map((f,fi)=>{
            const key = vk+"_"+ci+"_"+fi;
            return `<span class="chip ${state[key]?"sel":""}" data-act="chip" data-key="${key}">${esc(f)}</span>`;
          }).join("")}</div>
          <div class="addrow"><input type="text" placeholder="свой страх..." id="inp_${vk}_${ci}"><button data-act="add" data-vec="${vk}" data-card="${ci}">+</button></div>
          ${(state.custom[vk]||[]).length?`<div style="margin-top:8px">${(state.custom[vk]||[]).map((f,fi)=>{
            const key="c_"+vk+"_"+fi;
            return `<span class="chip sel" data-act="chip" data-key="${key}">${esc(f)} ✕</span>`;
          }).join("")}</div>`:""}
        </div>
      </div>`;
    });
  }
  html += `<p class="sub" style="margin-top:20px">Отмечено страхов: <b>${selectedFears().length}</b></p>`;
  app.innerHTML = html;
}

function renderS2(){
  const sel = selectedFears();
  if(sel.length === 0){
    app.innerHTML = `<div class="warnbox">Ни один страх не отмечен. Вернитесь на первый шаг и отметьте хотя бы один — только тогда можно определить вектор и стадию.</div>`;
    return;
  }
  const byVec = {};
  sel.forEach(s=>{ (byVec[s.vector] = byVec[s.vector]||[]).push(s); });
  let html = `<h2>Как это накрывает?</h2><p class="sub">Для каждого вектора, где есть отметки, выберите типичную форму реакции. Это лестница страха из вашей системы.</p>`;
  for(const vk in byVec){
    const v = DATA[vk];
    html += `<div class="vhead"><b>${v.name}</b> <span class="m">— ${byVec[vk].length} страх(ов)</span></div>`;
    REACTS.forEach((r,ri)=>{
      const key = "r_"+vk;
      html += `<label class="opt ${state[key]===ri?"sel":""}" data-act="react" data-key="${key}" data-ri="${ri}">${r[0]} <span class="sub" style="font-size:.85em"> · ${r[1]}</span></label>`;
    });
  }
  app.innerHTML = html;
}

function renderS3(){
  const sel = selectedFears();
  if(!sel.length){ app.innerHTML = `<div class="warnbox">Нет данных — вернитесь и отметьте страхи.</div>`; return; }
  const byVec = {};
  sel.forEach(s=>{ (byVec[s.vector] = byVec[s.vector]||[]).push(s); });
  let lead = null, max = 0;
  for(const vk in byVec){ if(byVec[vk].length>max){ max = byVec[vk].length; lead = vk; } }
  const beyond = sel.filter(s=>!s.custom && BEYOND_CARDS.has(s.card));
  let html = `<h2>🧭 Ваш векторальный профиль страха</h2>`;
  if(beyond.length) html += `<div class="warnbox"><b>Важно:</b> среди отметок есть состояния за пределами чакр (Og, Mc, Lv). По системе их не «прорабатывают» — из них выходят: сон, еда, тело, живой контакт. Если паранойя, ослепление или малодушие повторяются — это повод обратиться к специалисту.</div>`;
  html += `<table><tr><th>Вектор</th><th>Страхов</th><th>Стадия</th><th>Элемент</th></tr>`;
  for(const vk in byVec){
    const ri = state["r_"+vk];
    html += `<tr><td>${DATA[vk].name}</td><td>${byVec[vk].length}</td><td>${ri!==undefined?REACTS[ri][1]:"не отмечено"}</td><td>${ri!==undefined?ELEM[ri]:"—"}</td></tr>`;
  }
  html += `</table>`;
  const v = DATA[lead];
  const ri = state["r_"+lead];
  html += `<div class="lead"><b>Ведущий дом разлома: ${v.name}</b><br>
  Чакра ${v.chakra}, корень «${v.root}».<br>
  Стадия: ${ri!==undefined?REACTS[ri][1]:"не определена"} — ${ri!==undefined?REACTS[ri][0].toLowerCase():""}.<br><br>
  <b>Что лечит</b> (закон 13 — тьма не лечится внутри дома): партнёр — <b>${v.partner}</b>.<br>
  ${esc(v.heal)}</div>`;
  html += `<p class="sub">Лестница страха: ${LADDER}. Путь вверх — Осторожность → Трепет → Решимость → Смелость: страх не убирается, а переупаковывается в расчёт, затем в интерес, затем в шаг.</p>`;
  html += `<p class="sub">Далее — в тетрадь Дня 1: по каждому вектору из таблицы одна строка «что заметил(а)» вечером.</p>`;
  const canShare = (()=>{ try{ const f = new File([""], "t.json", {type:"application/json"}); return navigator.canShare && navigator.canShare({files:[f]}); }catch(e){ return false; } })();
  html += `<div class="repbtns"><button data-act="report">⬇ Получить отчёт (JSON)</button>${canShare?`<button class="ghost" data-act="share">📤 Поделиться</button>`:""}</div>`;
  app.innerHTML = html;
}

function render(){
  document.getElementById("bBack").style.display = screen==="s1" ? "none" : "";
  document.getElementById("bNext").style.display = screen==="s3" ? "none" : "";
  if(screen==="s1") renderS1();
  else if(screen==="s2") renderS2();
  else renderS3();
}

function buildReport(){
  const sel = selectedFears();
  const byVec = {};
  sel.forEach(s=>{ (byVec[s.vector] = byVec[s.vector]||[]).push(s); });
  let lead = null, max = 0;
  for(const vk in byVec){ if(byVec[vk].length>max){ max = byVec[vk].length; lead = vk; } }
  const vectors = Object.keys(byVec).map(vk=>{
    const ri = state["r_"+vk];
    return {
      vector: DATA[vk].name,
      chakra: DATA[vk].chakra,
      root: DATA[vk].root,
      reaction: ri!==undefined ? {label: REACTS[ri][0], stage: REACTS[ri][1], element: ELEM[ri]} : null,
      fears: byVec[vk].map(s=>({text: s.text, card: s.card, custom: s.custom}))
    };
  });
  const beyond = sel.filter(s=>!s.custom && BEYOND_CARDS.has(s.card)).map(s=>s.card);
  return {
    title: "Карта страхов — опросник Дня 1",
    generatedAt: new Date().toISOString(),
    version: "4.0",
    profile: {
      leadingVector: lead ? {name: DATA[lead].name, chakra: DATA[lead].chakra, root: DATA[lead].root} : null,
      reaction: lead && state["r_"+lead]!==undefined ? {label: REACTS[state["r_"+lead]][0], stage: REACTS[state["r_"+lead]][1], element: ELEM[state["r_"+lead]]} : null,
      healing: lead ? {partner: DATA[lead].partner, method: DATA[lead].heal} : null,
      ladder: LADDER,
      beyondChakras: beyond,
      totalFears: sel.length
    },
    vectors: vectors
  };
}

function reportFileName(){
  const d = new Date();
  const p = n=>String(n).padStart(2,"0");
  return "karta-strahov-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".json";
}

function downloadReport(){
  const blob = new Blob([JSON.stringify(buildReport(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = reportFileName();
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function shareReport(){
  const file = new File([JSON.stringify(buildReport(), null, 2)], reportFileName(), {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Карта страхов — опросник Дня 1"});
      return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  downloadReport();
}

document.getElementById("bNext").onclick = ()=>{
  if(screen==="s1"){ if(selectedFears().length===0){ alert("Отметьте хотя бы один страх — иначе нечего анализировать."); return; } screen="s2"; }
  else if(screen==="s2"){ screen="s3"; }
  save(); render(); window.scrollTo(0,0);
};
document.getElementById("bBack").onclick = ()=>{ screen = screen==="s3"?"s2":"s1"; render(); window.scrollTo(0,0); };
document.getElementById("bReset").onclick = ()=>{ if(confirm("Сбросить все отметки?")){ localStorage.removeItem("fearMap"); state = {}; screen="s1"; render(); } };

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;
  if(act==="toggle"){
    const id = t.dataset.card;
    state.open[id] = !state.open[id];
    save(); render();
  } else if(act==="chip"){
    const key = t.dataset.key;
    if(key.startsWith("c_")){
      const [,vk,fi] = key.split("_");
      state.custom[vk].splice(+fi,1);
    } else {
      state[key] = !state[key];
    }
    save(); render();
  } else if(act==="react"){
    state[t.dataset.key] = +t.dataset.ri;
    save(); render();
  } else if(act==="report"){
    downloadReport();
  } else if(act==="share"){
    shareReport();
  } else if(act==="add"){
    const vk = t.dataset.vec, ci = t.dataset.card;
    const inp = document.getElementById("inp_"+vk+"_"+ci);
    const val = inp.value.trim();
    if(!val) return;
    state.custom = state.custom||{};
    state.custom[vk] = state.custom[vk]||[];
    state.custom[vk].push(val);
    save(); render();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.tagName==="INPUT" && e.target.id.startsWith("inp_")){
    const [,vk,ci] = e.target.id.split("_");
    const val = e.target.value.trim();
    if(!val) return;
    state.custom = state.custom||{};
    state.custom[vk] = state.custom[vk]||[];
    state.custom[vk].push(val);
    save(); render();
  }
});

window.addEventListener("beforeprint", ()=>{
  document.querySelectorAll(".card").forEach(c=>c.classList.add("open"));
});

save(); render();
</script>
</body>
</html>
